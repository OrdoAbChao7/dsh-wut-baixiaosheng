name: 📤 提交校园资料 (Submit Campus Material)
description: 向武汉理工大学百晓生提交学校/学院新政策、培养方案、选课指南或课程资料
title: "[资料提交]: "
labels: ["community-contribution", "material-submission", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你为武汉理工大学百晓生贡献资料！
        所有上传文件默认存放于待审核区，维护者审核脱敏后合并入正式库。
  - type: input
    id: material-title
    attributes:
      label: 资料名称
      description: 简明说明文件名称（如：计算机学院2025年转专业细则/汽车学院选课指南）
      placeholder: 例如：计算机与人工智能学院2025年本科生转专业实施办法
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 资料分类
      options:
        - 转专业与大类分流
        - 培养方案与课程大纲
        - 评优评奖与综合测评
        - 考试安排与期末题库
        - 推荐免试研究生（保研）
        - 校园生活、宿舍与医保
        - 其它校园服务
    validations:
      required: true
  - type: dropdown
    id: college
    attributes:
      label: 所属学院/部门
      options:
        - 全校通用 / 校级机关
        - 本科生院 / 学工部 / 研究生院
        - 计算机与人工智能学院
        - 汽车工程学院
        - 交通与物流工程学院
        - 机械工程学院
        - 材料科学与工程学院
        - 信息工程学院
        - 自动化学院
        - 航海学院
        - 船海与能源动力工程学院
        - 土木工程与建筑学院
        - 化学化工与生命科学学院
        - 管理学院
        - 经济学院
        - 法学与人文社会学院
        - 马克思主义学院
        - 外国语学院
        - 艺术与设计学院
        - 理学院
        - 安全科学与应急管理学院
        - 其他二级单位
    validations:
      required: true
  - type: input
    id: source-url
    attributes:
      label: 官方信息源 / 链接
      description: 如有官方网页链接请附上；若是线下文件或通知群截图，请注明“线下纸质/辅导员年级通知”
      placeholder: http://... 或 2025级年级群文件
    validations:
      required: true
  - type: textarea
    id: material-content
    attributes:
      label: 资料核心内容 / 文件上传
      description: 请直接粘贴文本，或将 PDF/DOCX/图片 拖拽上传到此处
      placeholder: 可直接粘贴通知文本，或将文件拖曳到此输入框中上传附件...
    validations:
      required: true
  - type: checkboxes
    id: privacy-confirm
    attributes:
      label: 隐私安全合规承诺
      options:
        - label: 我已确认提交的内容不包含任何学生个人敏感隐私（无他人手机号、身份证号、银行卡号及单人成绩单）
          required: true
        - label: 我理解待审核资料需经维护者审核脱敏后方可正式发布
          required: true
